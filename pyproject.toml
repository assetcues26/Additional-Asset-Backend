[project]
name = "additional-asset"
version = "2.0.0"
description = "Additional Asset generation + Pinecone fill Azure Functions app"
requires-python = ">=3.11"
dependencies = [
    "azure-functions>=1.18.0",
    "google-genai>=2.18.0",
    "Pillow>=10.2.0",
    "httpx>=0.27.0",
    "pinecone>=5.0.0",
    "zxing-cpp>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["additional_asset*"]

[tool.ruff]
line-length = 119
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["additional_asset", "function_app"]
branch = true
